<body>

    <div>
        Form User Profiles
    </div>
    <br />
    <div>
        <select name="selType" id="selType">
            <option value="">-Select-</option>
            <option value="MYKAD">MYKAD</option>
            <option value="PASSPORT">PASSPORT</option>
        </select>
        Id Number: <input type="text" id="txtIdNo" name="txtIdNo" value="" />
        <input type="button" id="btnShowUserProfile" name="btnShowUserProfile" value="Show User Profile" />
        <input type="button" id="btnAddUserProfile" name="btnAddUserProfile" value="Add User Profile" onclick="openUserProfile('ADD','0');" />
    </div>
    <div>
        <div id="records_table" class="scrollable">
            <table border="0" cellpadding="3" cellspacing="0" width="100%">
                <tr><td align="center" valign="middle" height="40px"><font class="stdtitle"><font color="#000"><u>USER PROFILE LISTING</u></font></font></td></tr>
            </table>
            <table border="1" cellpadding="3" cellspacing="0" width="100%" style="border-collapse: collapse">
                <tr>
                    <td class="appbgribbon">#</td>
                    <td align="center"><font><b>Id</b></font></td>
                    <td align="center"><font><b>Name</font></b></td>
                    <td align="center"><font><b>Id Type</font></td>
                    <td align="center"><font><b>Id Number</b></font></td>
                    <td align="center"><font><b>Status</b></font></td>
                    <td align="center"><font><b></b></font></td>
                </tr>
                <tr>
                    <td colspan="7">No record found...</td>
                </tr>
            </table>
        </div>
    </div>
    <div style="display: none;">
        <input type="hidden" name="hidId" id="hidId" value="" />
    </div>

    <div class="modal fade" id="UserProfileModal" role="dialog">
        <div class="modal-dialog modal-md">
            <div class="modal-content">
                <div class="modal-body">
                    <div class="contentfolder">

                        <table id="tbSalaryItemDetail" width="98%" border="0" align="center" cellpadding="2" cellspacing="1" class="tblBg" style="border-spacing: 1px; border-collapse: inherit;">
                            <tr class="tblTitle3Mod">
                                <td colspan="2" align="left" valign="middle" class="tblTitle3ModBold">User Profile Details</td>
                            </tr>
                            <tr>
                                <td width="20%" class="tblTextCommon">Name</td>
                                <td width="80%" class="tblText2">
                                    <input id="txtName" name="txtName" type="text" size="50" maxlength="50" value="" class="input">
                                </td>
                            </tr>
                            <tr>
                                <td width="20%" class="tblTextCommon">Id Type</td>
                                <td width="80%" class="tblText2">
                                    <select id="lsIdType" name="lsIdType" class="select">
                                        <option value="MYKAD">MYKAD</option>
                                        <option value="PASSPORT">PASSPORT</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td width="20%" class="tblTextCommon">Id Number</td>
                                <td width="80%" class="tblText2">
                                    <input type="text" id="txtIdNumber" name="txtIdNumber" size="20" maxlength="20" value="" class="input" />
                                </td>
                            </tr>
                            <tr>
                                <td width="20%" class="tblTextCommon">Status</td>
                                <td width="80%" class="tblText2">
                                    <select id="lsStatus" name="lsStatus" class="select">
                                        <option value="NEW">NEW</option>
                                        <option value="MODIFIED">MODIFIED</option>
                                        <option value="CONFIRMED">CONFIRMED</option>
                                    </select>
                                </td>
                            </tr>
                        </table>
                        <table width="98%" border="0" cellpadding="2" cellspacing="1" align="center" id="tblParentButtonOpen" style="border-spacing: 1px; border-collapse: inherit;">
                            <tr>
                                <td align="center">
                                    <button id="btnAddItem" name="btnAddItem" type="button" class="button1 btn-primary" onclick="insertUserProfile();">Tambah</button>
                                    <button id="btnModifyItem" name="btnModifyItem" type="button" class="button1 btn-primary" onclick="updateUserProfile();">Simpan</button>
                                    <button type="button" class="button1" onclick="closeUserProfile();">Tutup</button>
                                </td>
                            </tr>
                        </table>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        $('#btnTestAPI').on('click', function (e) {

            var paramlist = {};
            paramlist.GetSetstatus = "TRUE";
            paramlist.GetSetmessage = "SUCCESS";
            var json_string = JSON.stringify(paramlist);

            PageMethod("HelloWorld2", json_string, succeedFn, failedFn, false);

        });

        var succeedFn = function (data, status, xmlData) {
            console.log("succeedFn: " + status);
            message = JSON.stringify(data);
            result = JSON.parse(message);
            alert(result.status);
            //alert("succeedFn: " + textStatus);
            //console.log("succeedFn: " + textStatus);
        }

        var failedFn = function (jqXHR, textStatus, errorThrown) {
            console.log("failedFn: " + textStatus);
            alert("failedFn: " + textStatus);
        }

        $('#btnShowUserProfile').on('click', function (e) {
            var paramlist = {};
            paramlist.GetSetidtype = $('#selType').val();
            paramlist.GetSetidno = $('#txtIdNo').val();
            var json_string = JSON.stringify(paramlist);

            PageMethod("getUserProfile", json_string, succeedgetUserProfile, failedgetUserProfile, false);
        });

        var succeedgetUserProfile = function (data, status, xmlData) {
            console.log("succeedgetUserProfile: " + status);
            message = JSON.stringify(data);
            result = JSON.parse(message);
            if (result.status == "Y") {
                //alert(result.listuserprofiles);
                //array/ list of user profiles
                var trHTML = '';
                trHTML += '<table border="1" cellpadding="3" cellspacing="0" width="100%" style="border-collapse: collapse">\n' +
                    '<tr><td class="appbgribbon">#</td>' +
                    '<td align="center"><font><b>Id</b></font></td>' +
                    '<td align="center"><font><b>Name</font></b></td>' +
                    '<td align="center"><font><b>Id Type</font></td>' +
                    '<td align="center"><font><b>Id Number</b></font></td>' +
                    '<td align="center"><font><b>Status</b></font></td>' +
                    '<td align="center"><font><b></b></font></td>' +
                    '</tr>\n';
                var idx = 0;
                $.each(result.listuserprofiles, function (i, rowdata) {
                    idx += 1;
                    trHTML += '<tr><td valign="top"><font>' + idx + '.</font></td>' +
                        '<td align="center" valign="top"><font>' + rowdata.GetSetid + '</font></td>' +
                        '<td align="center" valign="top"><font>' + rowdata.GetSetname + '</font></td>' +
                        '<td align="center" valign="top"><font>' + rowdata.GetSetidtype + '</font></td>' +
                        '<td align="center" valign="top"><font>' + rowdata.GetSetidno + '</font></td>' +
                        '<td align="center" valign="top"><font>' + rowdata.GetSetstatus + '</font></td>' +
                        '<td align="center" valign="top"><button type="button" class="button_warning enabled" onclick="openUserProfile(\'OPEN\',\'' + rowdata.GetSetid + '\');">Edit</button><button type="button" class="button_warning enabled" onclick="deleteUserProfile(\'' + rowdata.GetSetid + '\');"> Hapus</button ></td>' +
                        '</tr>\n';
                });
                trHTML += '</table><br/>';
                $('#records_table').empty();
                $('#records_table').append(trHTML);

            } else {
                alert("Error getting the userprofiles!");
            }
            //alert("succeedFn: " + textStatus);
            //console.log("succeedFn: " + textStatus);
        }

        var failedgetUserProfile = function (jqXHR, textStatus, errorThrown) {
            console.log("failedgetUserProfile: " + textStatus);
            alert("failedgetUserProfile: " + textStatus);
        }

        $('#btnCalculateSQF').on('click', function (e) {
            //callculation at client site
            //var sqf = $('#txtWidht').val() * $('#txtHeight').val();
            //alert(sqf);

            //callcucation at server site
            var paramlist = {};
            paramlist.GetSetwidth = $('#txtWidht').val();
            paramlist.GetSetheight = $('#txtHeight').val();
            var json_string = JSON.stringify(paramlist);

            PageMethod("CalculateSQF", json_string, succeedFnCall, failedFnCall, false);
        });

        var succeedFnCall = function (data, status, xmlData) {
            console.log("succeedFnCall: " + status);
            message = JSON.stringify(data);
            result = JSON.parse(message);
            if (result.status == "Y") {
                alert(result.sqf);
            } else {
                alert("Cannot calculate!");
            }
            //alert("succeedFn: " + textStatus);
            //console.log("succeedFn: " + textStatus);
        }

        var failedFnCall = function (jqXHR, textStatus, errorThrown) {
            console.log("failedFnCall: " + textStatus);
            alert("failedFnCall: " + textStatus);
        }

        function openUserProfile(typ, id) {
            $('#UserProfileModal').modal({ backdrop: "static" });
            //$('#UserProfileModal').modal('show');
            if (typ == 'OPEN') {

                $('#hidId').val(id);
                $('#btnAddItem').hide();
                $('#btnModifyItem').show();

                var paramlist = {};
                paramlist.GetSetid = $('#hidId').val();
                var getUserProfileDetails_parameters = JSON.stringify(paramlist);
                PageMethod("getUserProfileDetails", getUserProfileDetails_parameters, getUserProfileDetails_succeedAjaxFn, getUserProfileDetails_failedAjaxFn, false);

            } else {
                $('#hidId').val('');
                $('#btnAddItem').show();
                $('#btnModifyItem').hide();
            }
        }

        var getUserProfileDetails_succeedAjaxFn = function (data, textStatus, jqXHR) {
            console.log("getUserProfileDetails_succeedAjaxFn: " + textStatus);
            var message = JSON.stringify(data);
            var getUserProfileDetails_result = JSON.parse(message);
            if (getUserProfileDetails_result.status == "Y") {
                $('#txtName').val(getUserProfileDetails_result.userprofile.GetSetname);
                $('#lsIdType').val(getUserProfileDetails_result.userprofile.GetSetidtype);
                $('#txtIdNumber').val(getUserProfileDetails_result.userprofile.GetSetidno);
                $('#lsStatus').val(getUserProfileDetails_result.userprofile.GetSetstatus);
            }
            else {
                alert(getUserProfileDetails_result.message);
            }
        }
        var getUserProfileDetails_failedAjaxFn = function (jqXHR, textStatus, errorThrown) {
            console.log("getUserProfileDetails_failedAjaxFn: " + textStatus);
        }

        function insertUserProfile() {
            var paramlist = {};
            paramlist.GetSetname = $('#txtName').val();
            paramlist.GetSetidtype = $('#lsIdType').val();
            paramlist.GetSetidno = $('#txtIdNumber').val();
            paramlist.GetSetstatus = $('#lsStatus').val();
            paramlist.GetSetid = $('#hidId').val();
            var parameters = { 'userprofile': paramlist };
            var json_string = JSON.stringify(parameters);

            PageMethod("addUserProfileDetails", json_string, addUserProfileDetails_succeedAjaxFn, addUserProfileDetails_failedAjaxFn, false);
        }

        var addUserProfileDetails_succeedAjaxFn = function (data, textStatus, jqXHR) {
            console.log("addUserProfileDetails_succeedAjaxFn: " + textStatus);
            var message = JSON.stringify(data);
            var addUserProfileDetails_result = JSON.parse(message);
            if (addUserProfileDetails_result.status == "Y") {
                alert(addUserProfileDetails_result.message);

                var paramlist = {};
                paramlist.GetSetidtype = $('#selType').val();
                paramlist.GetSetidno = $('#txtIdNo').val();
                var json_string = JSON.stringify(paramlist);
                PageMethod("getUserProfile", json_string, succeedgetUserProfile, failedgetUserProfile, false);

            }
            else {
                alert(addUserProfileDetails_result.message);
            }
        }

        var addUserProfileDetails_failedAjaxFn = function (jqXHR, textStatus, errorThrown) {
            console.log("addUserProfileDetails_failedAjaxFn: " + textStatus);
        }

        function updateUserProfile() {
            var paramlist = {};
            paramlist.GetSetname = $('#txtName').val();
            paramlist.GetSetidtype = $('#lsIdType').val();
            paramlist.GetSetidno = $('#txtIdNumber').val();
            paramlist.GetSetstatus = $('#lsStatus').val();
            paramlist.GetSetid = $('#hidId').val();
            var parameters = { 'userprofile': paramlist };
            var json_string = JSON.stringify(parameters);

            PageMethod("updateUserProfileDetails", json_string, updateUserProfileDetails_succeedAjaxFn, updateUserProfileDetails_failedAjaxFn, false);
        }

        var updateUserProfileDetails_succeedAjaxFn = function (data, textStatus, jqXHR) {
            console.log("updateUserProfileDetails_succeedAjaxFn: " + textStatus);
            var message = JSON.stringify(data);
            var updateUserProfileDetails_result = JSON.parse(message);
            if (updateUserProfileDetails_result.status == "Y") {
                alert(updateUserProfileDetails_result.message);

                var paramlist = {};
                paramlist.GetSetidtype = $('#selType').val();
                paramlist.GetSetidno = $('#txtIdNo').val();
                var json_string = JSON.stringify(paramlist);
                PageMethod("getUserProfile", json_string, succeedgetUserProfile, failedgetUserProfile, false);

            }
            else {
                alert(updateUserProfileDetails_result.message);
            }
        }

        var updateUserProfileDetails_failedAjaxFn = function (jqXHR, textStatus, errorThrown) {
            console.log("updateUserProfileDetails_failedAjaxFn: " + textStatus);
        }

        function deleteUserProfile(id) {
            if (confirm("Adakah anda pasti?") == true) {
                var paramlist = {};
                paramlist.GetSetid = id;
                var deleteUserProfileDetails_parameters = JSON.stringify(paramlist);
                PageMethod("deleteUserProfileDetails", deleteUserProfileDetails_parameters, deleteUserProfileDetails_succeedAjaxFn, deleteUserProfileDetails_failedAjaxFn, false);
            }
        }

        var deleteUserProfileDetails_succeedAjaxFn = function (data, textStatus, jqXHR) {
            console.log("deleteUserProfileDetails_succeedAjaxFn: " + textStatus);
            var message = JSON.stringify(data);
            var deleteUserProfileDetails_result = JSON.parse(message);
            if (deleteUserProfileDetails_result.status == "Y") {
                alert(deleteUserProfileDetails_result.message);

                var paramlist = {};
                paramlist.GetSetidtype = $('#selType').val();
                paramlist.GetSetidno = $('#txtIdNo').val();
                var json_string = JSON.stringify(paramlist);
                PageMethod("getUserProfile", json_string, succeedgetUserProfile, failedgetUserProfile, false);

            }
            else {
                alert(deleteUserProfileDetails_result.message);
            }
        }

        var deleteUserProfileDetails_failedAjaxFn = function (jqXHR, textStatus, errorThrown) {
            console.log("deleteUserProfileDetails_failedAjaxFn: " + textStatus);
            alert("Error!\nUnable to delete User Profile...");
        }

        function closeUserProfile() {
            resetUserProfileForm();
            $('#UserProfileModal').modal('hide');
        }

        function resetUserProfileForm() {
            $('#hidId').val("");
            $('#txtName').val("");
            $('#lsIdType').val("MYKAD");
            $('#txtIdNumber').val("");
            $('#lsStatus').val("NEW");
        }
    </script>
</body>
</html>
