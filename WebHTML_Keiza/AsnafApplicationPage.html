<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asnaf Applications</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js" integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa" crossorigin="anonymous"></script>

    <!-- AJAX API Caller -->
    <script src="js/Ajax.API.Caller.js"></script>

    <style>
        body {
            padding-top: 20px;
            background-color: #f5f5f5;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .page-header {
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .asnaf-info {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #337ab7;
        }

        .asnaf-info-label {
            font-weight: bold;
            color: #333;
            margin-right: 10px;
        }

        .asnaf-info-value {
            color: #666;
        }

        .table-responsive {
            margin-top: 20px;
        }

        .table thead {
            background-color: #f9f9f9;
        }

        .table tbody tr {
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

            .table tbody tr:hover {
                background-color: #e8f4f8;
            }

        .search-box {
            margin-bottom: 20px;
        }

        .modal-header {
            background-color: #f9f9f9;
            border-bottom: 1px solid #e5e5e5;
        }

        .modal-body {
            padding: 20px;
        }

        .detail-row {
            margin-bottom: 15px;
        }

        .detail-label {
            font-weight: bold;
            color: #333;
            width: 180px;
            display: inline-block;
        }

        .detail-value {
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
        }

            .status-badge.draft {
                background-color: #d1ecf1;
                color: #0c5460;
            }

            .status-badge.submitted {
                background-color: #fff3cd;
                color: #856404;
            }

            .status-badge.approved {
                background-color: #d4edda;
                color: #155724;
            }

            .status-badge.rejected {
                background-color: #f8d7da;
                color: #721c24;
            }

            .status-badge.completed {
                background-color: #d4edda;
                color: #155724;
            }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .alert {
            margin-top: 10px;
        }

        .no-records {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .amount-display {
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1><span class="glyphicon glyphicon-folder-open"></span> Asnaf Applications</h1>
            <button class="btn btn-default btn-sm" id="btnBackToProfile">
                <span class="glyphicon glyphicon-arrow-left"></span> Back to Profile
            </button>
        </div>

        <!-- Asnaf Information -->
        <div class="asnaf-info" id="divAsnafInfo">
            <div class="row">
                <div class="col-md-6">
                    <span class="asnaf-info-label">Name:</span>
                    <span class="asnaf-info-value" id="lblAsnafName">-</span>
                </div>
                <div class="col-md-6">
                    <span class="asnaf-info-label">IC Number:</span>
                    <span class="asnaf-info-value" id="lblAsnafIcno">-</span>
                </div>
            </div>
            <div class="row" style="margin-top: 10px;">
                <div class="col-md-6">
                    <span class="asnaf-info-label">Contact:</span>
                    <span class="asnaf-info-value" id="lblAsnafContact">-</span>
                </div>
                <div class="col-md-6">
                    <span class="asnaf-info-label">Email:</span>
                    <span class="asnaf-info-value" id="lblAsnafEmail">-</span>
                </div>
            </div>
        </div>

        <!-- Search and Action Buttons -->
        <div class="search-box">
            <div class="row">
                <div class="col-md-6">
                    <div class="input-group">
                        <input type="text" class="form-control" id="txtSearch" placeholder="Search by Application No..." />
                        <span class="input-group-btn">
                            <button class="btn btn-primary" type="button" id="btnSearch">
                                <span class="glyphicon glyphicon-search"></span> Search
                            </button>
                        </span>
                    </div>
                </div>
                <div class="col-md-6 text-right">
                    <button class="btn btn-success" id="btnReload">
                        <span class="glyphicon glyphicon-refresh"></span> Reload
                    </button>
                    <button class="btn btn-info" id="btnAddNew">
                        <span class="glyphicon glyphicon-plus"></span> Add Application
                    </button>
                </div>
            </div>
        </div>

        <!-- Alert Messages -->
        <div id="divAlert"></div>

        <!-- Loading Indicator -->
        <div id="divLoading" class="loading">
            <span class="glyphicon glyphicon-refresh glyphicon-spin"></span> Loading applications...
        </div>

        <!-- Applications Table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered" id="applicationTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Application No</th>
                        <th>Amount</th>
                        <th>Currency</th>
                        <th>Status</th>
                        <th>Remarks</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody id="applicationTableBody">
                    <tr class="no-records">
                        <td colspan="7">No applications found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal fade" id="detailModal" tabindex="-1" role="dialog" aria-labelledby="detailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                    <h4 class="modal-title" id="detailModalLabel">Application Details</h4>
                </div>
                <div class="modal-body" id="divModalContent">
                    <!-- Details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="btnEdit">
                        <span class="glyphicon glyphicon-pencil"></span> Edit
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                    <h4 class="modal-title" id="editModalLabel">Edit Application</h4>
                </div>
                <div class="modal-body">
                    <form id="frmEditApplication">
                        <input type="hidden" id="txtEditAppUid" />

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="txtEditApplicationNo">Application No <span style="color: red;">*</span></label>
                                    <input type="text" class="form-control" id="txtEditApplicationNo" required />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="ddlEditStatus">Status</label>
                                    <select class="form-control" id="ddlEditStatus">
                                        <option value="DRAFT">DRAFT</option>
                                        <option value="SUBMITTED">SUBMITTED</option>
                                        <option value="APPROVED">APPROVED</option>
                                        <option value="REJECTED">REJECTED</option>
                                        <option value="COMPLETED">COMPLETED</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="txtEditAmount">Amount</label>
                                    <input type="number" step="0.01" class="form-control" id="txtEditAmount" placeholder="0.00" />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="txtEditCurrency">Currency</label>
                                    <select class="form-control" id="txtEditCurrency">
                                        <option value="MYR">MYR</option>
                                        <option value="USD">USD</option>
                                        <option value="SGD">SGD</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="txtEditRemarks">Remarks</label>
                                    <textarea class="form-control" id="txtEditRemarks" rows="3" placeholder="Additional notes or remarks"></textarea>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="btnSaveEdit">
                        <span class="glyphicon glyphicon-floppy-disk"></span> Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add New Modal -->
    <div class="modal fade" id="addModal" tabindex="-1" role="dialog" aria-labelledby="addModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                    <h4 class="modal-title" id="addModalLabel">Add New Application</h4>
                </div>
                <div class="modal-body">
                    <form id="frmAddApplication">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="txtAddApplicationNo">Application No <span style="color: red;">*</span></label>
                                    <input type="text" class="form-control" id="txtAddApplicationNo" required placeholder="e.g., APP-2024-001" />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="ddlAddStatus">Status</label>
                                    <select class="form-control" id="ddlAddStatus">
                                        <option value="DRAFT" selected>DRAFT</option>
                                        <option value="SUBMITTED">SUBMITTED</option>
                                        <option value="APPROVED">APPROVED</option>
                                        <option value="REJECTED">REJECTED</option>
                                        <option value="COMPLETED">COMPLETED</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="txtAddAmount">Amount</label>
                                    <input type="number" step="0.01" class="form-control" id="txtAddAmount" placeholder="0.00" />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="txtAddCurrency">Currency</label>
                                    <select class="form-control" id="txtAddCurrency">
                                        <option value="MYR" selected>MYR</option>
                                        <option value="USD">USD</option>
                                        <option value="SGD">SGD</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="txtAddRemarks">Remarks</label>
                                    <textarea class="form-control" id="txtAddRemarks" rows="3" placeholder="Additional notes or remarks"></textarea>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="btnSaveAdd">
                        <span class="glyphicon glyphicon-floppy-disk"></span> Add Application
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>// Global variables
        var gCurrentAsnafUid = '';
        var gCurrentAppUid = '';

        $(document).ready(function () {
            // Get asnafUid from URL parameter
            var urlParams = new URLSearchParams(window.location.search);
            gCurrentAsnafUid = urlParams.get('asnafUid');

            if (!gCurrentAsnafUid) {
                fnShowAlert('danger', 'Asnaf UID is missing. Redirecting to profiles page...');
                setTimeout(function () {
                    window.location.href = 'AsnafProfilePage.html';
                }, 2000);
                return;
            }

            // Load Asnaf information and applications
            fnLoadAsnafInfo(gCurrentAsnafUid);
            fnLoadApplications(gCurrentAsnafUid);

            // Event listeners
            $('#btnBackToProfile').click(function () {
                window.location.href = 'AsnafProfilePage.html';
            });

            $('#btnReload').click(function () {
                fnLoadApplications(gCurrentAsnafUid);
            });

            $('#btnSearch').click(function () {
                fnSearchApplications();
            });

            $('#txtSearch').keypress(function (e) {
                if (e.which == 13) { // Enter key
                    fnSearchApplications();
                    return false;
                }
            });

            $('#btnAddNew').click(function () {
                $('#addModal').modal('show');
            });

            $('#applicationTableBody').on('click', 'tr', function () {
                var appUid = $(this).attr('data-app-uid');
                if (appUid) {
                    fnLoadApplicationDetail(appUid);
                }
            });

            $('#btnEdit').click(function () {
                if (gCurrentAppUid) {
                    fnLoadApplicationForEdit(gCurrentAppUid);
                }
            });

            $('#btnSaveEdit').click(function () {
                fnUpdateApplication();
            });

            $('#btnSaveAdd').click(function () {
                fnAddApplication();
            });
        });

        /**
         * Load Asnaf Information
         */
        function fnLoadAsnafInfo(asnafUid) {
            var paramArray = JSON.stringify({ asnafUid: asnafUid });

            PageMethodMSSQL('GetAsnafProfileById', paramArray,
                function (data) {
                    if (data && data.status === 'Y' && data.data) {
                        $('#lblAsnafName').text(data.data.GetSetasnafName || '-');
                        $('#lblAsnafIcno').text(data.data.GetSetasnafIcno || '-');
                        $('#lblAsnafContact').text(data.data.GetSetcontactno || '-');
                        $('#lblAsnafEmail').text(data.data.GetSetemail || '-');
                    }
                },
                function (xhr, status, error) {
                    console.error('Error loading asnaf info: ' + error);
                },
                true
            );
        }

        /**
         * Load Applications
         */
        function fnLoadApplications(asnafUid) {
            fnShowLoading(true);
            fnClearAlert();

            var paramArray = JSON.stringify({ asnafUid: asnafUid });

            PageMethodMSSQL('GetAsnafApplicationsByAsnafUid', paramArray,
                function (data) {
                    fnOnLoadApplicationsSuccess(data);
                },
                function (xhr, status, error) {
                    fnOnError('Error loading applications: ' + error);
                },
                true
            );
        }

        /**
         * On Load Applications Success
         */
        function fnOnLoadApplicationsSuccess(data) {
            fnShowLoading(false);

            if (data) {
                if (data.status === 'Y' && data.data && data.data.length > 0) {
                    fnPopulateTable(data.data);
                    fnShowAlert('success', 'Applications loaded successfully. Total records: ' + data.data.length);
                } else {
                    fnShowNoRecords();
                    fnShowAlert('info', data.message || 'No applications found for this Asnaf.');
                }
            } else {
                fnShowNoRecords();
                fnShowAlert('warning', 'No data received from server.');
            }
        }

        /**
         * Search Applications
         */
        function fnSearchApplications() {
            var searchText = $('#txtSearch').val().trim();

            if (!searchText) {
                fnShowAlert('warning', 'Please enter search text.');
                return;
            }

            fnShowLoading(true);
            fnClearAlert();

            var paramArray = JSON.stringify({
                asnafUid: gCurrentAsnafUid,
                searchText: searchText
            });

            PageMethodMSSQL('SearchAsnafApplicationsByAsnafUid', paramArray,
                function (data) {
                    fnOnSearchApplicationsSuccess(data);
                },
                function (xhr, status, error) {
                    fnOnError('Error searching applications: ' + error);
                },
                true
            );
        }

        /**
         * On Search Applications Success
         */
        function fnOnSearchApplicationsSuccess(data) {
            fnShowLoading(false);

            if (data) {
                if (data.status === 'Y' && data.data && data.data.length > 0) {
                    fnPopulateTable(data.data);
                    fnShowAlert('success', 'Search completed. Found ' + data.data.length + ' record(s).');
                } else {
                    fnShowNoRecords();
                    fnShowAlert('info', data.message || 'No records found matching your search.');
                }
            } else {
                fnShowNoRecords();
                fnShowAlert('warning', 'No data received from server.');
            }
        }

        /**
         * Load Application Detail
         */
        function fnLoadApplicationDetail(appUid) {
            var paramArray = JSON.stringify({ appUid: appUid });

            PageMethodMSSQL('GetAsnafApplicationById', paramArray,
                function (data) {
                    fnOnLoadApplicationDetailSuccess(data);
                },
                function (xhr, status, error) {
                    fnOnError('Error loading application details: ' + error);
                },
                true
            );
        }

        /**
         * On Load Application Detail Success
         */
        function fnOnLoadApplicationDetailSuccess(data) {
            if (data) {
                if (data.status === 'Y' && data.data) {
                    gCurrentAppUid = data.data.GetSetappUid;
                    fnDisplayDetailModal(data.data);
                    $('#detailModal').modal('show');
                } else {
                    fnShowAlert('danger', data.message || 'Failed to load application details.');
                }
            }
        }

        /**
         * Load Application for Editing
         */
        function fnLoadApplicationForEdit(appUid) {
            var paramArray = JSON.stringify({ appUid: appUid });

            PageMethodMSSQL('GetAsnafApplicationById', paramArray,
                function (data) {
                    if (data && data.status === 'Y' && data.data) {
                        fnPopulateEditForm(data.data);
                        $('#detailModal').modal('hide');
                        $('#editModal').modal('show');
                    } else {
                        fnShowAlert('danger', 'Failed to load application for editing.');
                    }
                },
                function (xhr, status, error) {
                    fnShowAlert('danger', 'Error loading application: ' + error);
                },
                true
            );
        }

        /**
         * Populate Edit Form
         */
        function fnPopulateEditForm(app) {
            $('#txtEditAppUid').val(app.GetSetappUid);
            $('#txtEditApplicationNo').val(app.GetSetapplicationNo);
            $('#ddlEditStatus').val(app.GetSetapplicationStatus);
            $('#txtEditAmount').val(app.GetSetamount);
            $('#txtEditCurrency').val(app.GetSetcurrency);
            $('#txtEditRemarks').val(app.GetSetremarks);
        }

        /**
         * Add Application
         */
        function fnAddApplication() {
            var applicationNo = $('#txtAddApplicationNo').val().trim();
            if (!applicationNo) {
                fnShowAlert('warning', 'Application number is required.');
                $('#txtAddApplicationNo').focus();
                return;
            }

            var applicationStatus = $('#ddlAddStatus').val();
            var amount = $('#txtAddAmount').val().trim();
            var currency = $('#txtAddCurrency').val();
            var remarks = $('#txtAddRemarks').val().trim();
            var createdBy = 'SYSTEM'; // Replace with actual user

            var paramArray = JSON.stringify({
                asnafUid: gCurrentAsnafUid,
                applicationNo: applicationNo,
                applicationStatus: applicationStatus,
                amount: amount,
                currency: currency,
                remarks: remarks,
                createdBy: createdBy
            });

            fnShowLoading(true);
            fnClearAlert();

            PageMethodMSSQL('AddAsnafApplication', paramArray,
                function (data) {
                    fnOnSaveSuccess(data, 'add');
                },
                function (xhr, status, error) {
                    fnOnError('Error adding application: ' + error);
                },
                true
            );
        }

        /**
         * Update Application
         */
        function fnUpdateApplication() {
            var applicationNo = $('#txtEditApplicationNo').val().trim();
            if (!applicationNo) {
                fnShowAlert('warning', 'Application number is required.');
                $('#txtEditApplicationNo').focus();
                return;
            }

            var appUid = $('#txtEditAppUid').val();
            var applicationStatus = $('#ddlEditStatus').val();
            var amount = $('#txtEditAmount').val().trim();
            var currency = $('#txtEditCurrency').val();
            var remarks = $('#txtEditRemarks').val().trim();
            var modifiedBy = 'SYSTEM'; // Replace with actual user

            var paramArray = JSON.stringify({
                appUid: appUid,
                applicationNo: applicationNo,
                applicationStatus: applicationStatus,
                amount: amount,
                currency: currency,
                remarks: remarks,
                modifiedBy: modifiedBy
            });

            fnShowLoading(true);
            fnClearAlert();

            PageMethodMSSQL('UpdateAsnafApplication', paramArray,
                function (data) {
                    fnOnSaveSuccess(data, 'update');
                },
                function (xhr, status, error) {
                    fnOnError('Error updating application: ' + error);
                },
                true
            );
        }

        /**
         * On Save Success
         */
        function fnOnSaveSuccess(data, action) {
            fnShowLoading(false);

            if (data && data.status === 'Y') {
                var message = action === 'add' ?
                    'Application added successfully!' :
                    'Application updated successfully!';

                fnShowAlert('success', message);
                $('#addModal').modal('hide');
                $('#editModal').modal('hide');

                // Clear add form
                if (action === 'add') {
                    $('#frmAddApplication')[0].reset();
                }

                // Reload applications
                fnLoadApplications(gCurrentAsnafUid);
                gCurrentAppUid = '';
            } else {
                fnShowAlert('danger', data.message || 'Failed to save application.');
            }
        }

        /**
         * Populate Table with Data
         */
        function fnPopulateTable(data) {
            var tbody = $('#applicationTableBody');
            tbody.empty();

            var counter = 1;
            $.each(data, function (index, app) {
                var statusClass = fnGetStatusClass(app.GetSetapplicationStatus);
                var amount = app.GetSetamount ? parseFloat(app.GetSetamount).toFixed(2) : '0.00';

                var row = $('<tr>')
                    .attr('data-app-uid', app.GetSetappUid)
                    .append($('<td>').text(counter))
                    .append($('<td>').text(app.GetSetapplicationNo))
                    .append($('<td>').append(
                        $('<span>').addClass('amount-display').text(amount)
                    ))
                    .append($('<td>').text(app.GetSetcurrency || 'MYR'))
                    .append($('<td>').append(
                        $('<span>').addClass('status-badge ' + statusClass).text(app.GetSetapplicationStatus)
                    ))
                    .append($('<td>').text(fnTruncateText(app.GetSetremarks, 50)))
                    .append($('<td>').text(fnFormatDate(app.GetSetapplicationCreatedDate)));

                tbody.append(row);
                counter++;
            });
        }

        /**
         * Display Detail Modal
         */
        function fnDisplayDetailModal(app) {
            var amount = app.GetSetamount ? parseFloat(app.GetSetamount).toFixed(2) : '0.00';

            var content = `
                <div class="row">
                    <div class="col-md-6">
                        <div class="detail-row">
                            <span class="detail-label">Application No:</span>
                            <span class="detail-value">${fnNullCheck(app.GetSetapplicationNo)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Status:</span>
                            <span class="detail-value">
                                <span class="status-badge ${fnGetStatusClass(app.GetSetapplicationStatus)}">${fnNullCheck(app.GetSetapplicationStatus)}</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Amount:</span>
                            <span class="detail-value amount-display">${amount}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Currency:</span>
                            <span class="detail-value">${fnNullCheck(app.GetSetcurrency)}</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="detail-row">
                            <span class="detail-label">Remarks:</span>
                            <span class="detail-value">${fnNullCheck(app.GetSetremarks)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Created By:</span>
                            <span class="detail-value">${fnNullCheck(app.GetSetapplicationCreatedBy)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Created Date:</span>
                            <span class="detail-value">${fnFormatDate(app.GetSetapplicationCreatedDate)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Modified By:</span>
                            <span class="detail-value">${fnNullCheck(app.GetSetapplicationModifiedBy)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Modified Date:</span>
                            <span class="detail-value">${fnFormatDate(app.GetSetapplicationModifiedDate)}</span>
                        </div>
                    </div>
                </div>
            `;

            $('#divModalContent').html(content);
        }

        /**
         * Show No Records Message
         */
        function fnShowNoRecords() {
            var tbody = $('#applicationTableBody');
            tbody.empty();
            tbody.append($('<tr class="no-records">').append(
                $('<td colspan="7">').text('No applications found.')
            ));
        }

        /**
         * Show Loading Indicator
         */
        function fnShowLoading(show) {
            if (show) {
                $('#divLoading').show();
            } else {
                $('#divLoading').hide();
            }
        }

        /**
         * Show Alert Message
         */
        function fnShowAlert(type, message) {
            var alertClass = 'alert-' + type;
            var alertHtml = `<div class="alert ${alertClass} alert-dismissible" role="alert">
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                ${message}
            </div>`;

            $('#divAlert').append(alertHtml);

            // Auto-dismiss after 5 seconds
            setTimeout(function () {
                $('.alert').fadeOut('slow', function () {
                    $(this).remove();
                });
            }, 5000);
        }

        /**
         * Clear All Alerts
         */
        function fnClearAlert() {
            $('#divAlert').empty();
        }

        /**
         * Error Handler
         */
        function fnOnError(message) {
            fnShowLoading(false);
            fnShowAlert('danger', message);
            console.error(message);
        }

        /**
         * Format Date
         */
        function fnFormatDate(dateString) {
            if (!dateString || dateString === '') {
                return '-';
            }

            var date = new Date(dateString);
            if (isNaN(date.getTime())) {
                return dateString;
            }

            var day = String(date.getDate()).padStart(2, '0');
            var month = String(date.getMonth() + 1).padStart(2, '0');
            var year = date.getFullYear();
            var hours = String(date.getHours()).padStart(2, '0');
            var minutes = String(date.getMinutes()).padStart(2, '0');

            return day + '/' + month + '/' + year + ' ' + hours + ':' + minutes;
        }

        /**
         * Get Status Class
         */
        function fnGetStatusClass(status) {
            switch (status) {
                case 'DRAFT':
                    return 'draft';
                case 'SUBMITTED':
                    return 'submitted';
                case 'APPROVED':
                    return 'approved';
                case 'REJECTED':
                    return 'rejected';
                case 'COMPLETED':
                    return 'completed';
                default:
                    return 'draft';
            }
        }

        /**
         * Null Check
         */
        function fnNullCheck(value) {
            return (value && value !== null && value !== '') ? value : '-';
        }

        /**
         * Truncate Text
         */
        function fnTruncateText(text, length) {
            if (!text || text === '') return '-';
            return text.length > length ? text.substring(0, length) + '...' : text;
        }</script>
</body>
</html>
